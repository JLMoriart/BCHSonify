<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirits of Bitcoin</title>
<meta name="description" content="The Bitcoin Cash mempool as a line of spirits waiting for the ferry, with sound: every transaction a spirit with a lantern, every block a boat.">
<!-- The visitors' page: just the scene, with Mute and Volume. The settings and test controls are on studio.html. -->
<link rel="stylesheet" href="css/scene.css">
</head>
<body>
<div class="scene"><button id="donate" class="donate" type="button" aria-label="Donate"><span>Celebrate!</span><span>Donate</span></button><div class="sound"><button id="mute" type="button">Mute</button></div><div id="soul" role="dialog" aria-label="Transaction details" hidden></div><canvas id="scene" aria-label="Night view from the end of a pier, looking inland: a line of glowing wisps stands on the pier, and behind them the line zigzags back across a beach and a desert to the horizon, shrinking to single points of light. New wisps drop in from the sky; when a block is mined a lantern-lit boat glides in from the right, stops in front of the pier, and the chosen wisps fly into the great lantern at its bow before it glides away to the left."></canvas></div>

<div id="hint" hidden>Click anywhere for sound</div>

<dialog id="give" class="give" aria-labelledby="giveTitle">
  <h2 id="giveTitle">Celebrate with a donation</h2>
  <div class="dim">Every donation sends up a firework over the mountains. Give more, and it becomes a bigger sea creature.</div>
  <button class="close" type="button" aria-label="Close">×</button>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="wallet">Connect a wallet</button>
    <button type="button" role="tab" data-tab="qr">QR code</button>
  </div>
  <div data-pane="wallet">
    <div class="dim">Connect with WizardConnect, choose an amount, then approve it in your wallet.</div>
    <div class="row"><button id="wizConnect" type="button" class="primary">Connect wallet</button></div>
    <div id="wizPairing" hidden><div id="wizQr" class="qr"></div><div class="row"><a id="wizOpen" class="button" href="#">Open in a wallet on this device</a></div></div>
    <div id="wizDonate" hidden>
      <div class="amounts"></div>
      <div class="row"><label>Amount <input id="wizCustom" type="number" min="0.00000546" step="0.001" inputmode="decimal" style="width:9em"> BCH</label>
        <button id="wizSend" type="button" class="primary">Donate</button></div>
    </div>
    <p id="wizStatus" class="status" role="status"></p>
  </div>
  <div data-pane="qr" hidden>
    <div class="amounts"></div>
    <img id="donateQr" class="qr" alt="QR code for the donation">
    <div class="row"><span id="donateQrAmount" class="dim"></span></div>
    <div class="row"><code id="donateAddr"></code></div>
    <div class="row"><button id="donateCopy" type="button">Copy address</button><a id="donateOpen" class="button" href="#">Open in wallet</a></div>
  </div>
</dialog>
<script type="module" src="js/visualizer.js"></script>
</body>
</html>
